<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>total-recall · Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>trm graph build · cold run</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sequence-title sequence-desc">
      <title id="sequence-title">trm graph build, cold run</title>
      <desc id="sequence-desc">Sequence diagram showing a user invoking trm graph build, which walks and parses source files, upserts nodes and edges into an in-memory graph, saves it to disk, and returns a node and edge count.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Lifelines -->
      <line x1="100" y1="100" x2="100" y2="460" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="300" y1="100" x2="300" y2="460" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="500" y1="100" x2="500" y2="460" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="700" y1="100" x2="700" y2="460" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="900" y1="100" x2="900" y2="460" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Activation bars -->
      <rect x="96" y="140" width="8" height="240" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="296" y="180" width="8" height="40" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="496" y="220" width="8" height="70" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="0.8"/>
      <rect x="696" y="260" width="8" height="80" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- Messages -->
      <line x1="100" y1="140" x2="300" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="300" y1="180" x2="500" y2="180" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="220" x2="700" y2="220" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="500" y1="260" x2="700" y2="260" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="500" y1="290" x2="700" y2="290" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="700" y1="340" x2="304" y2="340" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="100" y1="380" x2="900" y2="380" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="900" y1="420" x2="104" y2="420" stroke="#eb6c36" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>

      <!-- Message labels -->
      <rect x="140" y="124" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="200" y="134" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TRM GRAPH BUILD</text>

      <rect x="336" y="164" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="400" y="174" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WALK + PARSE FILES</text>

      <rect x="540" y="204" width="120" height="12" rx="2" fill="#f5f5f5"/>
      <text x="600" y="214" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UPSERT NODE/EDGE</text>

      <rect x="548" y="244" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="600" y="254" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SAVE GRAPH.JSON</text>

      <rect x="536" y="298" width="128" height="12" rx="2" fill="#f5f5f5"/>
      <text x="600" y="308" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SAVE MANIFEST.JSON</text>

      <rect x="452" y="324" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="468" y="334" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OK</text>

      <rect x="452" y="364" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="374" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SUMMARY LINE</text>

      <rect x="452" y="404" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="508" y="414" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">N NODES, M EDGES</text>

      <!-- Actor headers -->
      <rect x="30" y="60" width="140" height="40" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)"/>
      <text x="100" y="78" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">User</text>
      <text x="100" y="92" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">terminal</text>

      <rect x="230" y="60" width="140" height="40" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)"/>
      <text x="300" y="78" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CLI</text>
      <text x="300" y="92" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">main.rs</text>

      <rect x="430" y="60" width="140" height="40" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)"/>
      <text x="500" y="78" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Extractor</text>
      <text x="500" y="92" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">tree-sitter, per-lang</text>

      <rect x="630" y="60" width="140" height="40" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="700" y="78" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CodeGraph</text>
      <text x="700" y="92" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">petgraph, in-memory</text>

      <rect x="830" y="60" width="140" height="40" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="900" y="78" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Disk</text>
      <text x="900" y="92" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">graph.json</text>

      <!-- Legend -->
      <line x1="30" y1="444" x2="970" y2="444" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <line x1="30" y1="460" x2="58" y2="460" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="66" y="463" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Call</text>

      <line x1="140" y1="460" x2="168" y2="460" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="176" y="463" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Primary write</text>

      <line x1="300" y1="460" x2="328" y2="460" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="336" y="463" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return</text>
    </svg>
  </div>
</body>
</html>
