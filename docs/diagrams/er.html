<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>total-recall · ER data model</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">ER · Diagram Design</p>
    <h1>trm graph · graph.json data model</h1>

    <svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="er-title er-desc">
      <title id="er-title">trm graph.json data model</title>
      <desc id="er-desc">Entity-relationship diagram showing GraphFile holding many Node and Edge records, with each Edge referencing a from and a to Node by id.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Relationship lines first -->
      <line x1="280" y1="130" x2="700" y2="130" stroke="#4f5d75" stroke-width="1"/>
      <line x1="170" y1="180" x2="170" y2="260" stroke="#4f5d75" stroke-width="1"/>
      <path d="M 310,307 H 772 Q 780,307 780,299 V 200" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <path d="M 310,353 H 852 Q 860,353 860,345 V 200" fill="none" stroke="#4f5d75" stroke-width="1"/>

      <!-- Cardinality labels -->
      <rect x="290" y="122" width="16" height="12" rx="2" fill="#f5f5f5"/>
      <text x="298" y="132" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text>
      <rect x="670" y="122" width="16" height="12" rx="2" fill="#f5f5f5"/>
      <text x="678" y="132" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">N</text>

      <rect x="162" y="188" width="16" height="12" rx="2" fill="#f5f5f5"/>
      <text x="170" y="198" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text>
      <rect x="162" y="240" width="16" height="12" rx="2" fill="#f5f5f5"/>
      <text x="170" y="250" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">N</text>

      <!-- Relationship labels -->
      <rect x="452" y="116" width="56" height="14" rx="2" fill="#f5f5f5"/>
      <text x="480" y="126" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">HOLDS</text>

      <rect x="142" y="212" width="56" height="14" rx="2" fill="#f5f5f5"/>
      <text x="170" y="222" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">HOLDS</text>

      <rect x="590" y="291" width="40" height="14" rx="2" fill="#f5f5f5"/>
      <text x="610" y="301" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">FROM</text>

      <rect x="670" y="337" width="26" height="14" rx="2" fill="#f5f5f5"/>
      <text x="683" y="347" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">TO</text>

      <!-- Entity: GraphFile -->
      <rect x="60" y="80" width="220" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="60" y="80" width="220" height="40" rx="6" fill="rgba(45,49,66,0.04)" stroke="none"/>
      <rect x="60" y="112" width="220" height="8" fill="rgba(45,49,66,0.04)"/>
      <line x1="60" y1="120" x2="280" y2="120" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="76" y="96" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY · ROOT</text>
      <text x="76" y="112" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">GraphFile</text>
      <text x="76" y="142" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">nodes</text>
      <text x="264" y="142" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">Vec&lt;Node&gt;</text>
      <text x="76" y="162" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">edges</text>
      <text x="264" y="162" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">Vec&lt;(id,id,kind)&gt;</text>

      <!-- Entity: Node (focal coral) -->
      <rect x="700" y="60" width="240" height="140" rx="6" fill="rgba(235,108,54,0.04)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="700" y="60" width="240" height="40" rx="6" fill="rgba(235,108,54,0.10)" stroke="none"/>
      <rect x="700" y="92" width="240" height="8" fill="rgba(235,108,54,0.10)"/>
      <line x1="700" y1="100" x2="940" y2="100" stroke="rgba(235,108,54,0.40)" stroke-width="1"/>
      <text x="716" y="76" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY · FOCAL</text>
      <text x="716" y="92" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Node</text>
      <text x="716" y="122" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace"># id</text>
      <text x="924" y="122" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">String · rel path::Name</text>
      <text x="716" y="142" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">kind</text>
      <text x="924" y="142" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">NodeKind</text>
      <text x="716" y="162" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">name</text>
      <text x="924" y="162" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">String</text>

      <!-- Entity: Edge (tuple) -->
      <rect x="30" y="260" width="280" height="140" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="30" y="260" width="280" height="40" rx="6" fill="rgba(45,49,66,0.04)" stroke="none"/>
      <rect x="30" y="292" width="280" height="8" fill="rgba(45,49,66,0.04)"/>
      <line x1="30" y1="300" x2="310" y2="300" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="46" y="276" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY · TUPLE</text>
      <text x="46" y="292" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Edge</text>
      <text x="46" y="322" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">from</text>
      <text x="294" y="322" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">Node.id</text>
      <text x="46" y="342" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">to</text>
      <text x="294" y="342" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">Node.id</text>
      <text x="46" y="362" fill="#2d3142" font-size="10" font-family="'Geist Mono', monospace">kind</text>
      <text x="294" y="362" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">EdgeKind</text>

      <!-- Caption -->
      <text x="380" y="424" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENUMS</text>
      <text x="440" y="424" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" font-style="italic">NodeKind: File · Function · Struct · Enum · Trait · Impl — EdgeKind: Contains · Calls · Implements · Uses</text>
    </svg>
  </div>
</body>
</html>
