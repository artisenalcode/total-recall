[package]
name = "total-recall"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "trm"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
fastembed = { version = "5.17.4", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls", "image-models"] }
serde_json = "1"
ureq = "3.3.0"

[dev-dependencies]
tempfile = "3.27.0"
