[package]
name = "total-recall"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "trm"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
flate2 = "1.0"
serde_json = "1"
sha2 = "0.10"
ureq = "3.3.0"
clap_mangen = "0.3.3"
# 2026-08-18: embeddings.rs ported off fastembed (ort underneath) onto
# candle, running the real sentence-transformers/all-MiniLM-L6-v2
# checkpoint directly -- same move squishi made for the identical reason
# (fastembed and magika forced incompatible ort prereleases across the
# two crates). See src/embeddings.rs's module doc comment and
# squishi/docs/ideation/ort-dependency-consistency/2026-08-18-ort-pin-and-bottleneck-plan.md.
# No candle-onnx here (unlike squishi) -- this crate never touches ONNX
# directly, so plain crates.io 0.11.0 is used unpatched.
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
hf-hub = { version = "=0.5.0", default-features = false, features = ["rustls-tls", "ureq"] }
tokenizers = "=0.22.2"
tree-sitter = "0.26.12"
tree-sitter-rust = "0.24.2"
petgraph = "0.8.3"
serde = { version = "1.0.229", features = ["derive"] }
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-go = "0.25.0"
tree-sitter-python = "0.25.0"

[dev-dependencies]
tempfile = "3.27.0"
