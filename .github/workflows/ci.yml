name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # `secrets` isn't a permitted context inside step `if:` conditions --
  # mirror it into `env` here so the checkout/cache/build steps below can
  # gate on env.SQUISHI_CHECKOUT_PAT instead.
  SQUISHI_CHECKOUT_PAT: ${{ secrets.SQUISHI_CHECKOUT_PAT }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.trm/models
          key: ${{ runner.os }}-total-recall-embedding-model-v2
      # ingest_session_stages_into_the_bank_resolved_from_the_session_s_own_cwd
      # (tests/cli.rs) needs the real `squishi` binary on PATH -- it's a
      # sibling private repo, so a same-scoped fine-grained PAT
      # (SQUISHI_CHECKOUT_PAT, contents:read on artisenalcode/squishi only)
      # checks it out here. Test skips itself gracefully if this secret isn't
      # set, so a fork/PR from someone without it still gets a green build,
      # just without this one test's real coverage.
      - name: Checkout squishi
        if: ${{ env.SQUISHI_CHECKOUT_PAT != '' }}
        uses: actions/checkout@v4
        with:
          repository: artisenalcode/squishi
          token: ${{ secrets.SQUISHI_CHECKOUT_PAT }}
          path: squishi-checkout
      # Real bug found 2026-08-09: keying the cache on Cargo.lock alone
      # means a squishi change that touches only src/ (no new dependency)
      # doesn't invalidate the cache -- CI silently reuses a stale binary
      # built before that change, and every test depending on the new
      # behavior fails against the old squishi. The checked-out commit SHA
      # is the actual identity of what's being built; key on that instead.
      - name: Get squishi commit SHA
        if: ${{ env.SQUISHI_CHECKOUT_PAT != '' }}
        id: squishi-sha
        run: echo "sha=$(git -C squishi-checkout rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Cache squishi build
        if: ${{ env.SQUISHI_CHECKOUT_PAT != '' }}
        id: squishi-bin-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/squishi
          key: ${{ runner.os }}-squishi-bin-${{ steps.squishi-sha.outputs.sha }}
      # squishi depends on candle-onnx, whose build script shells out to
      # `protoc` -- not present on the stock ubuntu-latest runner image.
      # A plain `apt-get update`/`install` hung indefinitely on 2026-08-19
      # (40+ min, cancelled) -- ubuntu-latest runners can have
      # unattended-upgrades holding the dpkg lock right after boot, and
      # apt just blocks on it. `arduino/setup-protoc` downloads the
      # prebuilt binary directly, no apt/dpkg involved.
      - name: Install protoc
        if: ${{ env.SQUISHI_CHECKOUT_PAT != '' && steps.squishi-bin-cache.outputs.cache-hit != 'true' }}
        uses: arduino/setup-protoc@v3
      - name: Build and install squishi
        if: ${{ env.SQUISHI_CHECKOUT_PAT != '' && steps.squishi-bin-cache.outputs.cache-hit != 'true' }}
        # --force: a squishi-bin-cache MISS (this step's own gate) doesn't
        # mean ~/.cargo/bin is actually empty -- Swatinem/rust-cache above
        # caches ~/.cargo/bin broadly, so a squishi binary built and
        # cached under a PRIOR run's cache key can still land here via
        # that layer, and `cargo install` refuses to overwrite without
        # this flag. Harmless either way: we always want the freshly
        # built binary for squishi-checkout's actual current commit.
        run: cargo install --path squishi-checkout --locked --force
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
