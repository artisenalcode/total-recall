name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.trm/models
          key: ${{ runner.os }}-total-recall-embedding-model-v2
      # ingest_session_stages_into_the_bank_resolved_from_the_session_s_own_cwd
      # (tests/cli.rs) needs the real `squishi` binary on PATH and skips itself
      # here since it isn't -- squishi lives in a sibling private repo with no
      # cross-repo checkout wired up (would need a PAT secret, not configured).
      # If that's added later, install squishi in a step above this one and
      # the test starts exercising the real path automatically, no code change.
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
