name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # `secrets` isn't allowed in step `if:` conditions -- mirror into `env`.
  SQUISHI_CHECKOUT_PAT: ${{ secrets.SQUISHI_CHECKOUT_PAT }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: ~/.trm/models
          key: ${{ runner.os }}-total-recall-embedding-model-v2
      # tests/cli.rs needs the real `squishi` binary on PATH -- it's a
      # sibling private repo, so a scoped PAT (contents:read on
      # artisenalcode/squishi) fetches its latest release asset here.
      # Tests skip themselves gracefully without this secret, so a fork/PR
      # still gets a green build, just without that one test's coverage.
      - name: Install squishi from its latest release
        if: ${{ env.SQUISHI_CHECKOUT_PAT != '' }}
        env:
          GH_TOKEN: ${{ secrets.SQUISHI_CHECKOUT_PAT }}
        run: |
          set -euo pipefail
          gh release download --repo artisenalcode/squishi \
            --pattern '*x86_64-unknown-linux-gnu*' -D squishi-dl --clobber
          tar xzf squishi-dl/*.tar.gz -C squishi-dl
          install -Dm755 squishi-dl/squishi ~/.cargo/bin/squishi
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
