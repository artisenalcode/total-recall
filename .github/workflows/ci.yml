name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # `secrets` isn't a permitted context inside step `if:` conditions --
  # mirror it into `env` here so the checkout/cache/build steps below can
  # gate on env.SQUISHI_CHECKOUT_PAT instead.
  SQUISHI_CHECKOUT_PAT: ${{ secrets.SQUISHI_CHECKOUT_PAT }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.trm/models
          key: ${{ runner.os }}-total-recall-embedding-model-v2
      # ingest_session_stages_into_the_bank_resolved_from_the_session_s_own_cwd
      # (tests/cli.rs) needs the real `squishi` binary on PATH -- it's a
      # sibling private repo, so a same-scoped fine-grained PAT
      # (SQUISHI_CHECKOUT_PAT, contents:read on artisenalcode/squishi only)
      # checks it out here. Test skips itself gracefully if this secret isn't
      # set, so a fork/PR from someone without it still gets a green build,
      # just without this one test's real coverage.
      - name: Checkout squishi
        if: ${{ env.SQUISHI_CHECKOUT_PAT != '' }}
        uses: actions/checkout@v4
        with:
          repository: artisenalcode/squishi
          token: ${{ secrets.SQUISHI_CHECKOUT_PAT }}
          path: squishi-checkout
      - name: Cache squishi build
        if: ${{ env.SQUISHI_CHECKOUT_PAT != '' }}
        id: squishi-bin-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/squishi
          key: ${{ runner.os }}-squishi-bin-${{ hashFiles('squishi-checkout/Cargo.lock') }}
      - name: Build and install squishi
        if: ${{ env.SQUISHI_CHECKOUT_PAT != '' && steps.squishi-bin-cache.outputs.cache-hit != 'true' }}
        run: cargo install --path squishi-checkout --locked
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
